<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desk Terminal</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#262c36;--tx:#e6e9ee;--mut:#8b93a1;--ok:#3fb68b;--bad:#e5534b;--acc:#5b9cf5}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--card:#fff;--line:#dfe3e8;--tx:#1b2028;--mut:#667085;--ok:#0f8a5f;--bad:#c93c37;--acc:#2563eb}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px}
.sub{color:var(--mut);margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.big{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}.lab{color:var(--mut);font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}@media(max-width:760px){.row{grid-template-columns:1fr}}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--acc);min-width:2px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--mut);font-weight:500}.scroll{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px}
</style></head><body><main>
<h1>Desk Terminal</h1><div class="sub" id="sub">loading…</div>
<div class="grid" id="cards"></div>
<div class="row"><div class="card"><h2>Where tokens die (all cycles)</h2><div id="funnel"></div></div>
<div class="card"><h2>Benched right now</h2><div id="bench"></div></div></div>
<div class="card" style="margin-bottom:12px"><h2>Would-be trades (shadow) · paper PnL</h2>
<div class="scroll"><table><thead><tr><th>Time</th><th>Token</th><th>Chain</th><th>Entry</th><th>Now</th><th>Paper PnL</th><th>Conf.</th><th>Size×</th></tr></thead><tbody id="orders"></tbody></table></div>
<div class="mut" style="margin-top:8px;font-size:12px">Paper PnL ignores fees, slippage and the RISK exit rule. It is a rough direction, not money.</div></div>
<div class="card"><h2>Recent cycles</h2><div class="scroll"><table><thead><tr><th>Time</th><th>Seen</th><th>Benched</th><th>Rejected</th><th>Result</th></tr></thead><tbody id="cycles"></tbody></table></div></div>
</main><script>
const $=id=>document.getElementById(id), t=s=>new Date(s*1000).toLocaleTimeString();
const pct=v=>v==null?'<span class="mut">n/a</span>':`<span class="${v>=0?'ok':'bad'}">${v>=0?'+':''}${v.toFixed(1)}%</span>`;
const px=v=>v==null?'—':(v<0.01?v.toExponential(2):v.toFixed(4));
const sum=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);
function bars(el,obj){const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]),m=Math.max(1,...e.map(x=>x[1]));
 $(el).innerHTML=e.length?e.map(([k,v])=>`<div class="bar"><span>${k}</span><i style="width:${v/m*100}%"></i><span class="mut">${v}</span></div>`).join(''):'<span class="mut">nothing yet</span>'}
async function load(){let d;try{d=await (await fetch('/api/state')).json()}catch(e){$('sub').textContent='dashboard cannot reach its server';return}
 const age=d.last_cycle?Math.round((d.now-d.last_cycle)/60):null;
 $('sub').innerHTML=d.last_cycle?`Last cycle ${t(d.last_cycle)} (${age} min ago) · updates every 10 s`:'No cycle recorded yet. Start run.py.';
 const f={};for(const s in d.funnel)for(const k in d.funnel[s])f[s+': '+k]=d.funnel[s][k];
 const p=d.paper;
 $('cards').innerHTML=[
  ['Cycles',d.cycle_count],['Tokens seen',d.seen],['Rejected',sum(f)],['Would-be trades',p.n],
  ['Paper avg',p.avg_pct==null?'n/a':(p.avg_pct>=0?'+':'')+p.avg_pct.toFixed(1)+'%'],
  ['Paper win rate',p.priced?Math.round(p.wins/p.priced*100)+'%':'n/a'],
  ['Open position',d.position?d.position.ticker:'none']
 ].map(([l,v])=>`<div class="card"><div class="lab">${l}</div><div class="big">${v}</div></div>`).join('');
 bars('funnel',f);bars('bench',d.bench);
 $('orders').innerHTML=d.orders.length?d.orders.map(o=>`<tr><td>${t(o.ts)}</td><td><b>${o.ticker}</b></td><td>${o.chain}</td><td>${px(o.entry)}</td><td>${px(o.now)}</td><td>${pct(o.pnl_pct)}</td><td>${o.confidence==null?'—':o.confidence.toFixed(2)}</td><td>${o.size_factor}</td></tr>`).join(''):'<tr><td colspan="8" class="mut">No would-be trades yet. Normal early on: the filter rejects almost everything.</td></tr>';
 $('cycles').innerHTML=d.recent.map(c=>{const s=c.stats||{};const rej=sum(s.free)+sum(s.trade)+sum(s.chain)+sum(s.soft);
  return `<tr><td>${t(c.ts)}</td><td>${s.seen??'—'}</td><td>${s.benched??'—'}</td><td>${s.held?'—':rej}</td><td>${s.held?'<span class="pill">holding '+s.held+'</span>':c.order?'<span class="pill ok">pick: '+c.order+'</span>':'<span class="mut">no trade</span>'}</td></tr>`}).join('')}
load();setInterval(load,10000);
</script></body></html>
